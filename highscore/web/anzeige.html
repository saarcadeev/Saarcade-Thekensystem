<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saarcade Highscores</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --hg: #0c0716;
    --kachel: #1a1029;
    --rand: #33224d;
    --text: #f6f0ff;
    --text2: #a998c4;
    --magenta: #e6007e;
    --gelb: #ffcc00;
    --blau: #009fe3;
    --silber: #d3dae3;
    --bronze: #e39a62;
    --spalten: 5;
    --fs: 28px;            /* wird per JS an die Spaltenbreite angepasst */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--hg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  body.maus-weg { cursor: none; }

  header {
    position: relative; z-index: 5;
    height: 11vh;
    display: flex; align-items: center; gap: 1.6vw;
    padding: 0 1.6vw;
    background: linear-gradient(90deg, #170b28 0%, #24072a 60%, #170b28 100%);
    border-bottom: .35vh solid var(--magenta);
    box-shadow: 0 1vh 2.5vh rgba(0,0,0,.6);
  }
  header img { height: 9vh; }
  .titel h1 {
    margin: 0;
    font-size: 4.6vh; line-height: 1;
    color: var(--gelb); letter-spacing: .08em; text-transform: uppercase;
  }
  #listen-name { font-size: 3vh; font-weight: 600; color: var(--text); margin-top: .5vh; }
  #punkte-rot { display: flex; gap: .6vh; margin-top: .6vh; }
  #punkte-rot span { width: 1.1vh; height: 1.1vh; border-radius: 50%; background: var(--rand); }
  #punkte-rot span.an { background: var(--magenta); }
  .rechts { margin-left: auto; text-align: right; }
  #uhr { font-size: 4.4vh; font-weight: 700; font-variant-numeric: tabular-nums; }
  #hinweis { font-size: 2vh; color: var(--text2); max-width: 32vw; }
  #status { font-size: 2vh; color: #ff6b6b; font-weight: 600; }
  #qr { display: flex; align-items: center; gap: .8vw; }
  #qr-text { font-size: 1.8vh; line-height: 1.25; color: var(--text2); text-align: right; }
  #qr-text b { display: block; color: var(--gelb); font-size: 2.1vh; }
  #qr-bild { height: 10vh; width: 10vh; border-radius: .6vh; overflow: hidden; }
  #qr-bild svg { display: block; width: 100%; height: 100%; }

  #modus {
    position: fixed; right: 1.2vw; bottom: 1.4vh; z-index: 8;
    display: flex; gap: 4px;
    background: rgba(12, 7, 22, .85);
    border: 1px solid var(--rand); border-radius: 10px; padding: 4px;
    opacity: .25; transition: opacity .3s;
  }
  #modus:hover, body.maus-aktiv #modus { opacity: 1; }
  #modus button {
    font: inherit; font-size: 15px; font-weight: 600;
    color: var(--text2); background: transparent;
    border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer;
  }
  #modus button.an { background: var(--magenta); color: #fff; }

  #fenster { position: absolute; top: 11vh; left: 0; right: 0; bottom: 0; overflow: hidden; }
  #band { will-change: transform; transition: opacity .7s; }
  #band.aus { opacity: 0; }
  #raster {
    display: grid;
    grid-template-columns: repeat(var(--spalten), minmax(0, 1fr));
    gap: 1.1vw;
    padding: 2.2vh 1.6vw 4vh;
    font-size: var(--fs);
  }

  .kachel {
    background: linear-gradient(180deg, #221536 0%, var(--kachel) 40%);
    border: 1px solid var(--rand);
    border-top: .18em solid var(--magenta);
    border-radius: .45em;
    padding: .45em .6em .5em;
    cursor: pointer;
  }
  .kachel:nth-child(4n+2) { border-top-color: var(--blau); }
  .kachel:nth-child(4n+3) { border-top-color: var(--gelb); }
  .kachel:nth-child(4n+4) { border-top-color: #b5006e; }
  .kname {
    font-size: 1.08em; font-weight: 800;
    color: var(--gelb);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: .25em;
  }
  .zeilen { height: 8.1em; display: flex; flex-direction: column; }
  .zeile {
    flex: 1;
    display: flex; align-items: center; gap: .4em;
    border-bottom: 1px solid rgba(255,255,255,.06);
    font-size: .86em;
  }
  .zeile:last-child { border-bottom: 0; }
  .platz {
    flex: 0 0 1.45em; height: 1.45em; line-height: 1.45em;
    text-align: center; border-radius: 50%;
    font-weight: 800; font-size: .8em;
    background: rgba(255,255,255,.08); color: var(--text2);
  }
  .p1 .platz { background: var(--gelb); color: #2a1a00; }
  .p2 .platz { background: var(--silber); color: #1d232b; }
  .p3 .platz { background: var(--bronze); color: #2b1606; }
  .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p1 .name { font-weight: 700; }
  .punkte { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .p1 .punkte { color: var(--gelb); }
  .neu {
    font-size: .55em; font-weight: 800; letter-spacing: .05em;
    background: var(--blau); color: #fff; border-radius: .35em; padding: .1em .4em;
  }
  .leer .name, .leer .punkte { color: #4f3f68; }
  .keiner {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text2); text-align: center; font-size: .85em;
  }
  .keiner b { color: var(--magenta); font-size: 1.1em; }

  #nichts {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 2vh; color: var(--text2); font-size: 3vh; text-align: center;
  }
  #nichts img { height: 30vh; }

  /* Detailanzeige */
  #detail {
    position: fixed; inset: 0; z-index: 20;
    background: #0a0614;
    display: flex; flex-direction: column;
    padding: 3.5vh 3vw 2vh;
    cursor: pointer;
  }
  #detail[hidden] { display: none; }
  #detail-kopf { display: flex; align-items: center; gap: 2vw; margin-bottom: 2.5vh; }
  #detail-kopf img { height: 9vh; }
  #detail h2 { margin: 0; font-size: 6vh; color: var(--gelb); line-height: 1.05; }
  #detail-info { font-size: 2.6vh; color: var(--text2); margin-top: .6vh; }
  #detail-zu { margin-left: auto; font-size: 2.2vh; color: var(--text2); }
  #detail-liste {
    flex: 1; min-height: 0;
    display: grid; grid-auto-flow: column; column-gap: 3vw;
    align-content: start;
    font-size: 2.9vh;
  }
  .dz {
    display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto 5.4em; gap: .6em; align-items: center;
    height: 1.95em; border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .dz .platz { font-size: .8em; }
  .dz .datum { color: var(--text2); font-size: .8em; text-align: right; font-variant-numeric: tabular-nums; }
  #detail-mehr { font-size: 2.4vh; color: var(--text2); margin-top: 1vh; }
  #detail-balken { height: .7vh; background: var(--rand); border-radius: 1vh; overflow: hidden; margin-top: 1.5vh; }
  #detail-balken div { height: 100%; width: 100%; background: var(--magenta); }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Saarcade">
  <div class="titel">
    <h1 id="titel">Highscores</h1>
    <div id="listen-name">&nbsp;</div>
  </div>
  <div id="punkte-rot"></div>
  <div class="rechts">
    <div id="uhr"></div>
    <div id="hinweis"></div>
    <div id="status"></div>
  </div>
  <div id="qr" hidden>
    <div id="qr-text"><b>Score eintragen</b>mit dem Handy<br>(Museums-WLAN)</div>
    <div id="qr-bild"></div>
  </div>
</header>

<main id="fenster">
  <div id="band"><div id="raster"></div></div>
  <div id="nichts" hidden>
    <img src="logo.png" alt="">
    <div>Noch keine Flipper angelegt.<br>Trag den ersten Highscore an der Eingabe ein!</div>
  </div>
</main>

<div id="modus" title="Welche Liste soll laufen? (Tasten 1–4)">
  <button data-l="wechselnd">Wechselnd</button>
  <button data-l="monat">Monat</button>
  <button data-l="jahr">Jahr</button>
  <button data-l="ewig">Ewig</button>
  <button data-l="vollbild" title="Vollbild (F11)">⛶</button>
</div>

<div id="detail" hidden>
  <div id="detail-kopf">
    <img src="logo.png" alt="">
    <div>
      <h2 id="detail-name"></h2>
      <div id="detail-info"></div>
    </div>
    <div id="detail-zu">Antippen zum Schließen</div>
  </div>
  <div id="detail-liste"></div>
  <div id="detail-mehr"></div>
  <div id="detail-balken"><div></div></div>
</div>

<script src="gemeinsam.js"></script>
<script src="qrcode.js"></script>
<script>
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August',
                'September', 'Oktober', 'November', 'Dezember'];
const REIHENFOLGE = ['ewig', 'jahr', 'monat'];

const fenster = document.getElementById('fenster');
const band = document.getElementById('band');
const raster = document.getElementById('raster');

let einst = { spalten: 5, zeilen: 4, tempo: 35, pause_sekunden: 5, liste: 'wechselnd', detail_sekunden: 10, titel: 'Highscores', hinweis: '' };
let modus = null;            // am Beamer gewählt (gespeichert) oder Standard aus den Einstellungen
let aktuelleListe = 'ewig';
let stand = -1;
let daten = null;

let versatz = 0;
let phase = 'pauseOben';
let phaseBis = 0;
let zuletzt = performance.now();
let detailOffen = false;
let detailTimer = null;
let wechselLaeuft = false;

function gespeicherterModus() {
  try { return localStorage.getItem('hsBeamerListe'); } catch (e) { return null; }
}
function modusMerken(m) {
  try { if (m) localStorage.setItem('hsBeamerListe', m); else localStorage.removeItem('hsBeamerListe'); } catch (e) { /* egal */ }
}
function effektiverModus() { return modus || einst.liste || 'wechselnd'; }

function listenName(l) {
  const h = new Date();
  if (l === 'monat') return `Monatsbestenliste ${MONATE[h.getMonth()]} ${h.getFullYear()}`;
  if (l === 'jahr') return `Jahresbestenliste ${h.getFullYear()}`;
  return 'Ewige Bestenliste';
}

// QR-Code zur Eingabe; Adresse kommt vom Server (aktuelle WLAN-Adresse oder fest eingestellt)
let qrFuer = null;
function qrAktualisieren() {
  const ziel = einst.qr_zeigen === '0' ? '' : (einst.eingabe_adresse || '');
  if (ziel === qrFuer) return;
  qrFuer = ziel;
  const box = document.getElementById('qr');
  try {
    document.getElementById('qr-bild').innerHTML = ziel ? QR.svg(ziel) : '';
    box.hidden = !ziel;
  } catch (e) { box.hidden = true; }
}

function kopfAktualisieren() {
  document.getElementById('titel').textContent = einst.titel || 'Highscores';
  document.getElementById('hinweis').textContent = einst.hinweis || '';
  qrAktualisieren();
  document.getElementById('listen-name').textContent = listenName(aktuelleListe);
  const m = effektiverModus();
  document.getElementById('punkte-rot').innerHTML = m === 'wechselnd'
    ? REIHENFOLGE.map(l => `<span class="${l === aktuelleListe ? 'an' : ''}"></span>`).join('') : '';
  document.querySelectorAll('#modus button').forEach(b => b.classList.toggle('an', b.dataset.l === m));
}

let kachelEm = 0;             // Höhe einer Kachel in em, einmal gemessen
function schriftAnpassen() {
  const spalten = Number(einst.spalten) || 5;
  const zeilen = Number(einst.zeilen) || 4;
  document.documentElement.style.setProperty('--spalten', spalten);
  const w = window.innerWidth, h = window.innerHeight, abstand = w * 0.011;
  const breite = (w * (1 - 0.032) - (spalten - 1) * abstand) / spalten;
  if (!kachelEm) {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;font-size:100px;width:3000px';
    probe.innerHTML = '<div class="kachel"><div class="kname">X</div><div class="zeilen"></div></div>';
    document.body.appendChild(probe);
    kachelEm = probe.firstChild.offsetHeight / 100;
    probe.remove();
  }
  // so groß, dass die gewünschte Anzahl Reihen ganz auf den Bildschirm passt und die Spaltenbreite reicht
  const hoehe = (h * (0.89 - 0.022) - zeilen * abstand) / zeilen;
  const fs = Math.min(breite * 0.061, hoehe / kachelEm);
  document.documentElement.style.setProperty('--fs', fs.toFixed(1) + 'px');
}

function zeileHtml(s, platz) {
  if (!s) return `<div class="zeile leer p${platz}"><span class="platz">${platz}</span><span class="name">–</span><span class="punkte">–</span></div>`;
  return `<div class="zeile p${platz}"><span class="platz">${platz}</span>`
    + `<span class="name">${HS.esc(s.spieler)}</span>${s.neu ? '<span class="neu">NEU</span>' : ''}`
    + `<span class="punkte">${HS.zahl(s.score)}</span></div>`;
}

function zeichnen() {
  const f = daten ? daten.flipper : [];
  document.getElementById('nichts').hidden = f.length > 0;
  raster.innerHTML = f.map(m => {
    let inhalt;
    if (!m.scores.length) {
      inhalt = `<div class="keiner"><b>Noch kein Highscore</b>${aktuelleListe === 'ewig' ? 'Jetzt eintragen!' : 'in diesem ' + (aktuelleListe === 'monat' ? 'Monat' : 'Jahr')}</div>`;
    } else {
      inhalt = [0, 1, 2, 3, 4].map(i => zeileHtml(m.scores[i], i + 1)).join('');
    }
    return `<div class="kachel" data-id="${m.id}"><div class="kname">${HS.esc(m.name)}</div><div class="zeilen">${inhalt}</div></div>`;
  }).join('');
  kopfAktualisieren();
  const max = maxVersatz();
  if (versatz > max) versatz = max;
}

function maxVersatz() { return Math.max(0, band.scrollHeight - fenster.clientHeight); }

async function laden(liste) {
  const d = await HS.api('board?liste=' + liste);
  daten = d;
  aktuelleListe = d.liste;
  stand = d.stand;
  zeichnen();
}

async function einstellungenLaden() {
  einst = await HS.api('einstellungen');
  schriftAnpassen();
}

// ---------- Scroll-Schleife
function phaseSetzen(p, sekunden) { phase = p; phaseBis = performance.now() + sekunden * 1000; }

function schritt(t) {
  const dt = Math.min((t - zuletzt) / 1000, 0.1);
  zuletzt = t;
  if (!detailOffen && !wechselLaeuft && daten) {
    const max = maxVersatz();
    if (phase === 'laufen') {
      versatz += (Number(einst.tempo) || 35) * dt;
      if (versatz >= max) { versatz = max; phaseSetzen('pauseUnten', Number(einst.pause_sekunden)); }
    } else if (phase === 'pauseOben' && t >= phaseBis) {
      if (max > 0) phase = 'laufen';
      else phaseSetzen('pauseUnten', Math.max(20, Number(einst.pause_sekunden) * 4));   // passt auf einen Bildschirm
    } else if (phase === 'pauseUnten' && t >= phaseBis) {
      durchlaufEnde();
    }
    band.style.transform = `translate3d(0, ${-versatz}px, 0)`;
  }
  requestAnimationFrame(schritt);
}

async function durchlaufEnde() {
  wechselLaeuft = true;
  band.classList.add('aus');
  await new Promise(r => setTimeout(r, 750));
  let naechste = aktuelleListe;
  const m = effektiverModus();
  if (m === 'wechselnd') naechste = REIHENFOLGE[(REIHENFOLGE.indexOf(aktuelleListe) + 1) % REIHENFOLGE.length];
  else naechste = m;
  try { await einstellungenLaden(); await laden(naechste); verbunden(true); } catch (e) { verbunden(false); }
  versatz = 0;
  band.style.transform = 'translate3d(0, 0, 0)';
  band.classList.remove('aus');
  phaseSetzen('pauseOben', Number(einst.pause_sekunden));
  wechselLaeuft = false;
}

// sofort auf eine Liste springen (Modus-Knopf)
async function springen(liste) {
  if (wechselLaeuft) return;
  if (detailOffen) detailSchliessen();
  // bei „wechselnd“ beginnt es wieder mit der ewigen Liste
  if (liste === 'wechselnd') aktuelleListe = REIHENFOLGE[REIHENFOLGE.length - 1];
  await durchlaufEnde();
}

// ---------- Aktualisierung: alle 10 s prüfen, ob es neue Einträge gibt
function verbunden(ok) {
  document.getElementById('status').textContent = ok ? '' : 'Keine Verbindung zum Highscore-Server';
}
async function pruefen() {
  try {
    const s = await HS.api('stand');
    verbunden(true);
    if (s.stand !== stand && !wechselLaeuft) {
      await einstellungenLaden();
      await laden(aktuelleListe);
    }
  } catch (e) { verbunden(false); }
}

// ---------- Detailanzeige
async function detailZeigen(id) {
  let d;
  try { d = await HS.api(`flipper/${id}/scores`); } catch (e) { return; }
  detailOffen = true;
  const box = document.getElementById('detail');
  document.getElementById('detail-name').textContent = d.flipper.name;
  const n = d.scores.length;
  document.getElementById('detail-info').textContent = n
    ? `Alle Highscores · ${n} ${n === 1 ? 'Eintrag' : 'Einträge'}` : 'Noch keine Highscores';
  box.hidden = false;

  const liste = document.getElementById('detail-liste');
  // je mehr Spalten, desto kleiner die Schrift, damit die Namen lesbar bleiben
  const groessen = [2.9, 2.7, 2.3, 1.95];
  let spalten = 1, proSpalte = 5;
  for (; spalten <= groessen.length; spalten++) {
    proSpalte = Math.max(5, Math.floor((liste.clientHeight - 4) / (window.innerHeight * groessen[spalten - 1] / 100 * 1.95)));
    if (n <= proSpalte * spalten || spalten === groessen.length) break;
  }
  liste.style.fontSize = groessen[spalten - 1] + 'vh';
  const passt = proSpalte * spalten;
  const zeigen = d.scores.slice(0, n > passt ? passt : n);
  liste.style.gridTemplateRows = `repeat(${Math.min(proSpalte, Math.max(zeigen.length, 1))}, auto)`;
  liste.style.gridTemplateColumns = spalten === 1 ? 'minmax(0, 60vw)' : `repeat(${spalten}, minmax(0, 1fr))`;
  liste.style.justifyContent = spalten === 1 ? 'center' : 'stretch';
  liste.innerHTML = zeigen.map((s, i) => `<div class="dz p${i + 1}"><span class="platz">${i + 1}</span>`
    + `<span class="name">${HS.esc(s.spieler)} ${s.neu ? '<span class="neu">NEU</span>' : ''}</span>`
    + `<span class="punkte">${HS.zahl(s.score)}</span><span class="datum">${HS.datum(s.datum)}</span></div>`).join('');
  document.getElementById('detail-mehr').textContent = n > zeigen.length ? `… und ${n - zeigen.length} weitere Einträge` : '';

  const sek = Number(einst.detail_sekunden) || 10;
  const balken = document.querySelector('#detail-balken div');
  balken.style.transition = 'none';
  balken.style.width = '100%';
  balken.offsetWidth;   // Neustart der Animation erzwingen
  balken.style.transition = `width ${sek}s linear`;
  balken.style.width = '0%';
  clearTimeout(detailTimer);
  detailTimer = setTimeout(detailSchliessen, sek * 1000);
}
function detailSchliessen() {
  clearTimeout(detailTimer);
  document.getElementById('detail').hidden = true;
  detailOffen = false;
  zuletzt = performance.now();
}

raster.addEventListener('click', ev => {
  const k = ev.target.closest('.kachel');
  if (k) detailZeigen(k.dataset.id);
});
document.getElementById('detail').addEventListener('click', detailSchliessen);

document.getElementById('modus').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.l === 'vollbild') {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    return;
  }
  modus = b.dataset.l;
  modusMerken(modus);
  springen(modus);
});
document.addEventListener('keydown', ev => {
  const l = { '1': 'wechselnd', '2': 'monat', '3': 'jahr', '4': 'ewig' }[ev.key];
  if (l) { modus = l; modusMerken(l); springen(l); }
  if (ev.key === 'Escape' && detailOffen) detailSchliessen();
});

// Mauszeiger nach 3 s ausblenden
let mausTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('maus-weg');
  document.body.classList.add('maus-aktiv');
  clearTimeout(mausTimer);
  mausTimer = setTimeout(() => { document.body.classList.add('maus-weg'); document.body.classList.remove('maus-aktiv'); }, 3000);
});

function uhr() {
  const h = new Date();
  document.getElementById('uhr').textContent = h.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

window.addEventListener('resize', () => { schriftAnpassen(); zeichnen(); });

(async function start() {
  modus = gespeicherterModus();
  uhr();
  setInterval(uhr, 10000);
  for (;;) {
    try {
      await einstellungenLaden();
      const m = effektiverModus();
      await laden(m === 'wechselnd' ? REIHENFOLGE[0] : m);
      verbunden(true);
      break;
    } catch (e) {
      verbunden(false);
      await new Promise(r => setTimeout(r, 5000));
    }
  }
  phaseSetzen('pauseOben', Number(einst.pause_sekunden));
  setInterval(pruefen, 10000);
  requestAnimationFrame(schritt);
})();
</script>
</body>
</html>
