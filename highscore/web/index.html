<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saarcade Highscores</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="basis.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 30px 16px; text-align: center; }
  main img { width: min(360px, 80vw); margin-bottom: 20px; }
  .wahl { display: grid; gap: 12px; }
  .wahl a {
    display: block; text-decoration: none; color: var(--text);
    background: var(--flaeche); border: 1px solid var(--rand); border-radius: 14px;
    padding: 18px; font-size: 1.2rem; font-weight: 700;
  }
  .wahl a:hover { border-color: var(--magenta); }
  .wahl small { display: block; color: var(--text2); font-weight: 400; font-size: .9rem; margin-top: 3px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Saarcade e.V.">
  <div class="wahl">
    <a href="/eingabe">Highscore eintragen<small>Am Notebook oder per Handy</small></a>
    <a href="/anzeige">Beamer-Anzeige<small>Bestenlisten aller Flipper, scrollt automatisch</small></a>
    <a href="/verwaltung">Verwaltung<small>Flipper, Spieler zusammenführen, Einstellungen</small></a>
  </div>
</main>
</body>
</html>
